name: "Verify dependency chain"
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  dependency-change-verification:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changeDetection.outputs.should-run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify build.gradle changed
        id: changeDetection
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="${BEFORE_SHA}..HEAD"
          else
            DIFF_RANGE="HEAD~1..HEAD"
          fi
          should_run=false
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ (^|/)build\.gradle(\.kts)?$ || "$file" =~ (^|/)libs\.versions\.toml$ || "$file" =~ ^gradle/ ]]; then
              echo "$file was changed"
              should_run=true
            fi
          done < <(git diff -z --name-only "$DIFF_RANGE" || true)
          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: dependency-change-verification
    if: needs.dependency-change-verification.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Read Go version from project
        run: |
          GO_VERSION=$(grep -E "^de\.schuelken\.cloudbridge\.goVersion=" gradle.properties | cut -d'=' -f2)
          echo "GO_VERSION=$GO_VERSION" >> $GITHUB_ENV
          echo "Go version: $GO_VERSION"
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Go from gradle.properties
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '${{env.GO_VERSION}}'
        id: go
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install NDK from gradle.properties
        run: |
          NDK_VERSION="$(grep -E "^de\.schuelken\.cloudbridge\.ndkVersion=" gradle.properties | cut -d'=' -f2)"
          sdkmanager "ndk;${NDK_VERSION}"
      - name: Build app
        run: ./gradlew assembleOssDebug
      - name: Upload debug APK for isolated dependency scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk-for-scan
          path: app/build/outputs/apk/oss/debug/cloudbridge_v*-oss-universal-debug.apk
          if-no-files-found: error
          retention-days: 1

  scan-apk:
    runs-on: ubuntu-latest
    needs: build-debug-apk
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a6288b6c92c90c0083c5 # v4
        with:
          name: debug-apk-for-scan
          path: scanned-apk
      - name: 'Check for non-FOSS libraries'
        run: |
          set -euo pipefail
          # prepare scanapk with apktool and verify official SHA-256 digest
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${apktoolVersion}/apktool_${apktoolVersion}.jar"
          echo "${apktoolSha256}  apktool_${apktoolVersion}.jar" | sha256sum -c -
          printf '#!/bin/bash\njava -jar "$(dirname "$0")/apktool.jar" "$@"\n' > apktool
          # Pin IzzyOnDroid radar repo to an audited immutable commit SHA
          mkdir -p repo
          git -C repo init -q
          git -C repo remote add origin https://gitlab.com/IzzyOnDroid/repo.git
          git -C repo fetch --depth 1 origin "${izzyRepoSha}"
          git -C repo checkout -q FETCH_HEAD
          mkdir -p repo/lib/radar/tool
          mv apktool* repo/lib/radar/tool
          chmod u+x repo/lib/radar/tool/apktool
          mv "repo/lib/radar/tool/apktool_${apktoolVersion}.jar" repo/lib/radar/tool/apktool.jar
          repo/bin/scanapk.php scanned-apk/cloudbridge_v*-oss-universal-debug.apk
        env:
          apktoolVersion: "2.9.3"
          apktoolSha256: "7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4"
          izzyRepoSha: "deddda86f2746bd89fcd5a4a40db54ba6ffd37ec"
